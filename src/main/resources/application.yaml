spring:
  application:
    name: eventuas

  threads:
    virtual:
      enabled: true

  config:
    import:
      - optional:file:./development.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventuas}
    username: ${DB_USER:eventuas}
    password: ${DB_PASSWORD:eventuas}

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:http://localhost:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-system}] %logger{36} - %msg%n"

app:
  qr:
    secret: ${APP_QR_SECRET}
  check-in:
    grace: ${APP_CHECK_IN_GRACE:PT6H}
    rate-limit-per-minute: ${APP_CHECK_IN_RATE_LIMIT:60}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}