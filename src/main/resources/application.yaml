spring:
  application:
    name: eventuas

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventuas}
    username: ${DB_USER:eventuas}
    password: ${DB_PASSWORD:eventuas}

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090

  config:
    import:
      - optional:file:development.env

app:
  qr:
    secret: ${APP_QR_SECRET}